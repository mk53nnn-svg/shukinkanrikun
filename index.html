<script>

/* ===== USERS ===== */
let users = JSON.parse(localStorage.getItem("users")) || {
  arai:    {pass:"1234", name:"新井",  admin:false},
  hosoya:  {pass:"1234", name:"細谷",  admin:false},
  ikeda:   {pass:"1234", name:"池田",  admin:false},
  yamamoto:{pass:"1234", name:"山本",  admin:true}
};

let currentUser = null;
let editIndex   = -1;
let currentSort   = "new";
let abcDir        = 1;
let currentFilter = "all";
let currentStaff  = "all";  // 担当者フィルター

/* ===== INIT ===== */
if(localStorage.getItem("loginUser")){
  currentUser = localStorage.getItem("loginUser");
  start();
}

/* ===== LOGIN ===== */
function login(){
  let id = loginId.value, pw = loginPw.value;
  if(users[id] && users[id].pass === pw){
    currentUser = id;
    localStorage.setItem("loginUser", id);
    start();
  } else alert("ログイン失敗");
}

function logout(){
  localStorage.removeItem("loginUser");
  location.reload();
}

/* ===== START ===== */
function start(){
  loginPage.classList.add("hidden");
  mainPage.classList.remove("hidden");
  welcome.innerHTML = users[currentUser].name + " さん";

  let isAdmin = users[currentUser].admin;
  adminBtnNav.classList.toggle("hidden", !isAdmin);
  homeBtn.classList.toggle("hidden", isAdmin);

  resetAddForm();
  load();

  if(isAdmin){ adminView(); buildStaffFilter(); show("admin"); }
  else { summaryView(); show("home"); }
}

/* ===== RESET FORM ===== */
function resetAddForm(){
  customer.value = "";
  memo.value     = "";
  let t = new Date();
  date.value = t.getFullYear() + "-"
    + String(t.getMonth()+1).padStart(2,"0") + "-"
    + String(t.getDate()).padStart(2,"0");
  items.innerHTML = "";
  total.innerText = "0";
  editIndex = -1;
  addItem();
}

/* ===== NAV ===== */
function show(p){
  ["homePage","addPage","listPage","adminPage"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(p+"Page").classList.remove("hidden");
}

function showAdd(){
  resetAddForm();
  show("add");
}

/* ===== DATA ===== */
function getData(){ return JSON.parse(localStorage.getItem("records")||"[]"); }
function setData(d){ localStorage.setItem("records", JSON.stringify(d)); }

/* ===== ITEMS ===== */
function addItem(){
  let div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `
    <input placeholder="商品名" class="n">
    <input placeholder="数量" type="number" class="q" oninput="calc()">
    <input placeholder="単価" type="number" class="p" oninput="calc()">
  `;
  items.appendChild(div);
}

function calc(){
  let qs = document.querySelectorAll(".q");
  let ps = document.querySelectorAll(".p");
  let sum = 0;
  for(let i=0;i<qs.length;i++) sum += (qs[i].value||0)*(ps[i].value||0);
  total.innerText = sum;
}

/* ===== SAVE ===== */
function save(){
  let d = getData();
  let itemsArr = [];
  document.querySelectorAll("#items .row").forEach(r=>{
    itemsArr.push({
      name:  r.querySelector(".n").value,
      qty:   Number(r.querySelector(".q").value||0),
      price: Number(r.querySelector(".p").value||0)
    });
  });
  let totalVal = itemsArr.reduce((a,b)=>a+b.qty*b.price, 0);
  let obj = {
    user:     currentUser,
    customer: customer.value,
    date:     date.value,
    items:    itemsArr,
    total:    totalVal,
    memo:     memo.value,
    paid:     false
  };
  if(editIndex === -1){ d.push(obj); }
  else { obj.paid = d[editIndex].paid; d[editIndex] = obj; }

  setData(d);
  load();
  summaryView();
  if(users[currentUser].admin) adminView();
  resetAddForm();
  show("list");
}

/* ===== FILTER ===== */
function setFilter(f){
  currentFilter = f;
  ["all","unpaid","paid"].forEach(k=>{
    document.getElementById("f-"+k).classList.toggle("active", k===f);
  });
  load();
}

/* ===== STAFF FILTER ===== */
function buildStaffFilter(){
  // 管理者以外は非表示
  if(!users[currentUser].admin) return;
  let bar = document.getElementById("staffFilterBar");
  let wrap = document.getElementById("staffFilterWrap");
  wrap.classList.remove("hidden");

  // 全員ボタン + 社員ごとのボタンを生成
  let html = `<button id="sf-all" onclick="setStaff('all')" class="${currentStaff==='all'?'active':''}">全員</button>`;
  Object.keys(users).forEach(u=>{
    if(users[u].admin) return;
    let active = currentStaff === u ? "active" : "";
    html += `<button id="sf-${u}" onclick="setStaff('${u}')" class="${active}">${users[u].name}</button>`;
  });
  bar.innerHTML = html;
}

function setStaff(u){
  currentStaff = u;
  buildStaffFilter();
  load();
}

/* ===== SORT ===== */
function setSort(s){
  if(s === "abc"){
    abcDir = (currentSort === "abc") ? abcDir * -1 : 1;
  }
  currentSort = s;
  ["new","old","abc"].forEach(k=>{
    document.getElementById("s-"+k).classList.toggle("active", k===s);
  });
  let abcBtn = document.getElementById("s-abc");
  if(s === "abc"){
    abcBtn.textContent = abcDir === 1 ? "あいうえお順 ▲" : "ん〜あ順 ▼";
  } else {
    abcBtn.textContent = "あいうえお順";
  }
  load();
}

/* ===== LOAD LIST ===== */
function load(){
  let d = getData();

  let visible = d.map((r,i)=>({r,i})).filter(({r})=>{
    return r.user === currentUser || users[currentUser].admin;
  });

  if(currentFilter === "unpaid") visible = visible.filter(({r})=>!r.paid);
  if(currentFilter === "paid")   visible = visible.filter(({r})=>r.paid);
  if(users[currentUser].admin && currentStaff !== "all") visible = visible.filter(({r})=>r.user===currentStaff);

  visible.sort((a,b)=>{
    if(currentSort === "new") return b.r.date.localeCompare(a.r.date);
    if(currentSort === "old") return a.r.date.localeCompare(b.r.date);
    if(currentSort === "abc"){
      return (a.r.customer||"").localeCompare(b.r.customer||"","ja") * abcDir;
    }
  });

  records.innerHTML = "";
  if(visible.length === 0){
    records.innerHTML = '<div style="color:#999;padding:10px">該当する記録がありません</div>';
    return;
  }

  visible.forEach(({r,i})=>{
    let memoHtml   = r.memo ? `<div class="memo-text">📝 ${r.memo}</div>` : "";
    let userLabel  = users[currentUser].admin
      ? `<span style="font-size:12px;color:#888">${users[r.user]?.name||r.user}</span><br>`
      : "";
    records.innerHTML += `
      <div class="list">
        ${userLabel}
        ${r.date} / ${r.customer}<br>
        ¥${r.total}<br>
        <span class="badge ${r.paid?'green':'red'}">${r.paid?'集金済':'未集金'}</span>
        ${memoHtml}<br>
        <button class="small" onclick="toggle(${i})">切替</button>
        <button class="small" onclick="edit(${i})">編集</button>
        <button class="small" onclick="del(${i})">削除</button>
      </div>
    `;
  });
}

/* ===== ACTIONS ===== */
function toggle(i){
  let d = getData();
  d[i].paid = !d[i].paid;
  setData(d); load(); summaryView();
  if(users[currentUser].admin) adminView();
}

function del(i){
  if(confirm("削除しますか？")){
    let d = getData();
    d.splice(i,1);
    setData(d); load(); summaryView();
    if(users[currentUser].admin) adminView();
  }
}

function edit(i){
  let d = getData()[i];
  customer.value = d.customer;
  date.value     = d.date;
  memo.value     = d.memo || "";
  items.innerHTML = "";
  d.items.forEach(it=>{
    let div = document.createElement("div");
    div.className = "row";
    div.innerHTML = `
      <input class="n" value="${it.name}">
      <input class="q" value="${it.qty}"   type="number" oninput="calc()">
      <input class="p" value="${it.price}" type="number" oninput="calc()">
    `;
    items.appendChild(div);
  });
  editIndex = i;
  calc();
  show("add");
}

/* ===== SUMMARY ===== */
function summaryView(){
  if(users[currentUser].admin) return;
  let d = getData().filter(x=>x.user===currentUser);
  let remain = d.filter(x=>!x.paid).reduce((a,b)=>a+b.total, 0);
  summary.innerHTML = `件数：${d.length}<br>未集金：${d.filter(x=>!x.paid).length}<br>売上残合計：¥${remain}`;
}

/* ===== ADMIN ===== */
function adminView(){
  if(!users[currentUser].admin) return;
  let d = getData();
  let html = "";
  Object.keys(users).forEach(u=>{
    if(users[u].admin) return;
    let remain = d.filter(x=>x.user===u && !x.paid).reduce((a,b)=>a+b.total,0);
    html += `${users[u].name}：¥${remain}<br>`;
  });
  adminSummaryTop.innerHTML = html;
  buildStaffFilter(); // 社員変更時にフィルターも更新

  userList.innerHTML = "";
  Object.keys(users).forEach(u=>{
    userList.innerHTML += `
      <div class="list" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
        <div>ID:${u}　名前:${users[u].name}　${users[u].admin?'<span style="color:#1976d2;font-size:12px">[管理者]</span>':''}</div>
        <div>
          <button class="small" onclick="openEditUserModal('${u}')">編集</button>
          <button class="small" onclick="delUser('${u}')">削除</button>
        </div>
      </div>
    `;
  });
}

/* ===== USER ADD / DEL ===== */
function addUser(){
  if(!newId.value||!newName.value||!newPw.value){ alert("全項目を入力してください"); return; }
  users[newId.value] = {pass:newPw.value, name:newName.value, admin:false};
  localStorage.setItem("users", JSON.stringify(users));
  newId.value = newName.value = newPw.value = "";
  adminView();
}

function delUser(id){
  if(id==="yamamoto") return alert("削除不可");
  if(!confirm(users[id].name+"を削除しますか？")) return;
  delete users[id];
  localStorage.setItem("users", JSON.stringify(users));
  adminView();
}

/* ===== USER EDIT MODAL ===== */
function openEditUserModal(id){
  editUserId.value   = id;
  editUserName.value = users[id].name;
  editUserPw.value   = users[id].pass;
  editUserModal.classList.remove("hidden");
}

function closeEditUserModal(){
  editUserModal.classList.add("hidden");
}

function saveEditUser(){
  let id = editUserId.value;
  if(!editUserName.value || !editUserPw.value){
    alert("名前とパスワードを入力してください");
    return;
  }
  users[id].name = editUserName.value;
  users[id].pass = editUserPw.value;
  localStorage.setItem("users", JSON.stringify(users));
  closeEditUserModal();
  adminView();
  alert(users[id].name + " の情報を更新しました");
}

</script>
