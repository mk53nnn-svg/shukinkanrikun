<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>集金管理くん</title>
<style>
body{margin:0;font-family:sans-serif;background:#f3f8ff}
header{background:#1976d2;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.container{padding:15px;max-width:700px;margin:auto}
.card{background:#fff;padding:15px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
button{background:#1976d2;color:#fff;border:none;font-weight:bold}
.small{width:auto;padding:8px 10px;margin-right:6px}
.hidden{display:none}
.list{padding:10px;border-bottom:1px solid #ddd}
.red{color:#e53935;font-weight:bold}
.green{color:#43a047;font-weight:bold}
</style>
</head>
<body>

<header>集金管理くん</header>

<div class="container">

<div id="loginPage" class="card">
<h3>ログイン</h3>
<input id="id" placeholder="ID">
<input id="pw" type="password" placeholder="パスワード">
<button onclick="login()">ログイン</button>
</div>

<div id="mainPage" class="hidden">

<div class="card">
<div id="welcome"></div>
<button onclick="show('home')">ホーム</button>
<button onclick="show('add')">登録</button>
<button onclick="show('list')">一覧</button>
<button onclick="logout()">ログアウト</button>
</div>

<div id="homePage" class="card">
<h3>ホーム</h3>
<div id="summary"></div>
</div>

<div id="addPage" class="card hidden">
<h3>納品登録</h3>
<input id="customer" placeholder="取引先名">
<input id="date" type="date">
<input id="total" type="number" placeholder="金額">
<button onclick="save()">保存</button>
</div>

<div id="listPage" class="card hidden">
<h3>一覧</h3>
<div id="records"></div>
</div>

</div>
</div>

<script>
const users={
tanaka:"1234",
sato:"1234",
suzuki:"1234",
yamamoto:"1234"
};

let user="";
let editIndex=-1;

if(localStorage.getItem("loginUser")){
user=localStorage.getItem("loginUser");
start();
}

function login(){
let id=document.getElementById("id").value;
let pw=document.getElementById("pw").value;
if(users[id]===pw){
user=id;
localStorage.setItem("loginUser",id);
start();
}else alert("ログイン失敗");
}

function logout(){
localStorage.removeItem("loginUser");
location.reload();
}

function start(){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("mainPage").classList.remove("hidden");
document.getElementById("welcome").innerHTML=user+" さん";
document.getElementById("date").valueAsDate=new Date();
showSummary();
load();
}

function show(x){
document.getElementById("homePage").classList.add("hidden");
document.getElementById("addPage").classList.add("hidden");
document.getElementById("listPage").classList.add("hidden");

if(x=="home")document.getElementById("homePage").classList.remove("hidden");
if(x=="add")document.getElementById("addPage").classList.remove("hidden");
if(x=="list")document.getElementById("listPage").classList.remove("hidden");
}

function getData(){
return JSON.parse(localStorage.getItem("records")||"[]");
}

function setData(d){
localStorage.setItem("records",JSON.stringify(d));
}

function save(){
let d=getData();

let obj={
user:user,
customer:customer.value,
date:date.value,
total:Number(total.value),
paid:false
};

if(editIndex==-1){
d.push(obj);
}else{
obj.paid=d[editIndex].paid;
d[editIndex]=obj;
editIndex=-1;
}

setData(d);
customer.value="";
total.value="";
load();
showSummary();
show("list");
}

function load(){
let d=getData();
let area=document.getElementById("records");
area.innerHTML="";

d.forEach((r,i)=>{
if(r.user==user || user=="yamamoto"){
area.innerHTML+=`
<div class="list">
${r.date} / ${r.customer} / ¥${r.total}<br>
<span class="${r.paid?'green':'red'}">${r.paid?'集金済':'未集金'}</span><br>
<button class="small" onclick="toggle(${i})">切替</button>
<button class="small" onclick="editRec(${i})">編集</button>
<button class="small" onclick="delRec(${i})">削除</button>
</div>
`;
}
});
}

function toggle(i){
let d=getData();
d[i].paid=!d[i].paid;
setData(d);
load();
showSummary();
}

function editRec(i){
let d=getData();
customer.value=d[i].customer;
date.value=d[i].date;
total.value=d[i].total;
editIndex=i;
show("add");
}

function delRec(i){
if(confirm("削除しますか？")){
let d=getData();
d.splice(i,1);
setData(d);
load();
showSummary();
}
}

function showSummary(){
let d=getData().filter(x=>x.user==user || user=="yamamoto");

let count=d.length;
let unpaid=d.filter(x=>!x.paid).length;
let remain=d.filter(x=>!x.paid).reduce((a,b)=>a+b.total,0);

summary.innerHTML=`
件数：${count}件<br>
未集金：${unpaid}件<br>
売上残合計：¥${remain}
`;
}
</script>

</body>
</html>
