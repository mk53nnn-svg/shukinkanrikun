<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, push, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyB_gHDRNuZqlAjCdbbwCaClpav-6qauLig",
  authDomain: "shukin-kanri.firebaseapp.com",
  databaseURL: "https://shukin-kanri-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shukin-kanri",
  storageBucket: "shukin-kanri.firebasestorage.app",
  messagingSenderId: "854144324735",
  appId: "1:854144324735:web:04d80a5076430150505b4a"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ===== STATE ===== */
let users = {
  arai:    {pass:"1234", name:"新井",  admin:false},
  hosoya:  {pass:"1234", name:"細谷",  admin:false},
  ikeda:   {pass:"1234", name:"池田",  admin:false},
  yamamoto:{pass:"1234", name:"山本",  admin:true}
};
let currentUser   = null;
let editIndex     = -1;
let currentSort   = "new";
let abcDir        = 1;
let currentFilter = "all";
let currentStaff  = "all";
let recordsCache  = [];
let userOrder     = [];  // 社員の表示順（IDの配列）

/* ===== LOADING ===== */
function showLoading(msg="読み込み中…"){
  document.getElementById("loadingMsg").textContent = msg;
  document.getElementById("loadingOverlay").classList.remove("hidden");
}
function hideLoading(){
  document.getElementById("loadingOverlay").classList.add("hidden");
}

/* ===== FIREBASE: USERS ===== */
async function loadUsers(){
  const snap = await get(ref(db,"users"));
  if(snap.exists()){ users = snap.val(); }
  else { await set(ref(db,"users"), users); }
  // userOrder を Firebase から読み込み
  const orderSnap = await get(ref(db,"userOrder"));
  if(orderSnap.exists()){
    userOrder = orderSnap.val();
    // usersに存在するIDだけ残し、新規IDは末尾に追加
    userOrder = userOrder.filter(id=>users[id]);
    Object.keys(users).forEach(id=>{ if(!userOrder.includes(id)) userOrder.push(id); });
  } else {
    userOrder = Object.keys(users);
    await set(ref(db,"userOrder"), userOrder);
  }
}
async function saveUsers(){ await set(ref(db,"users"), users); }
async function saveUserOrder(){ await set(ref(db,"userOrder"), userOrder); }

/* ===== FIREBASE: RECORDS ===== */
function listenRecords(){
  onValue(ref(db,"records"), (snap)=>{
    if(snap.exists()){
      let obj = snap.val();
      recordsCache = Object.keys(obj).map(k=>({_key:k,...obj[k]}));
    } else { recordsCache = []; }
    if(currentUser){ load(); summaryView(); if(users[currentUser]?.admin) adminView(); }
  });
}
function getData(){ return recordsCache; }
async function pushRecord(obj)  { const r=push(ref(db,"records")); await set(r,obj); }
async function updateRecord(k,obj){ await set(ref(db,"records/"+k),obj); }
async function deleteRecord(k)  { await remove(ref(db,"records/"+k)); }

/* ===== INIT ===== */
(async ()=>{
  showLoading("起動中…");
  try {
    await loadUsers();
    listenRecords();
    let saved = localStorage.getItem("loginUser");
    if(saved && users[saved]){ currentUser=saved; start(); }
  } catch(e){
    // Firebase接続失敗 → エラーをログイン画面に表示してローカルで動作
    console.error("Firebase error:", e);
    let msg = document.createElement("div");
    msg.style.cssText = "background:#fff3e0;color:#e65100;padding:10px;border-radius:8px;font-size:12px;margin-top:8px;word-break:break-all";
    msg.innerHTML = "⚠️ サーバー接続エラー：" + e.message + "<br><small>ローカルモードで起動します</small>";
    loginPage.appendChild(msg);
    // ローカルのusersでログインできるようフォールバック
  } finally {
    hideLoading();
  }
})();

/* ===== LOGIN ===== */
window.login = function(){
  let id=loginId.value.trim(), pw=loginPw.value;
  if(users[id] && users[id].pass===pw){
    currentUser=id;
    localStorage.setItem("loginUser",id);
    start();
  } else alert("ログイン失敗");
};

window.logout = function(){
  localStorage.removeItem("loginUser");
  currentUser=null;
  location.reload();
};

/* ===== START ===== */
function start(){
  loginPage.classList.add("hidden");
  mainPage.classList.remove("hidden");
  welcome.innerHTML = users[currentUser].name+" さん";
  let isAdmin = users[currentUser].admin;
  adminBtnNav.classList.toggle("hidden",!isAdmin);
  homeBtn.classList.toggle("hidden",isAdmin);
  resetAddForm();
  load();
  if(isAdmin){ adminView(); buildStaffFilter(); show("admin"); }
  else { summaryView(); show("home"); }
}

/* ===== RESET FORM ===== */
function resetAddForm(){
  customer.value=""; memo.value="";
  let t=new Date();
  date.value=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  items.innerHTML=""; total.innerText="0";
  editIndex=-1; addItem();
}

/* ===== NAV ===== */
window.show = function(p){
  ["homePage","addPage","listPage","adminPage"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(p+"Page").classList.remove("hidden");
};
window.showAdd = function(){ resetAddForm(); show("add"); };

/* ===== ITEMS ===== */
window.addItem = function(){
  let div=document.createElement("div");
  div.className="row";
  div.innerHTML=`
    <input placeholder="商品名" class="n">
    <input placeholder="数量" type="number" class="q" oninput="calc()">
    <input placeholder="単価" type="number" class="p" oninput="calc()">
  `;
  items.appendChild(div);
};
window.calc = function(){
  let qs=document.querySelectorAll(".q"), ps=document.querySelectorAll(".p"), sum=0;
  for(let i=0;i<qs.length;i++) sum+=(qs[i].value||0)*(ps[i].value||0);
  total.innerText=sum;
};

/* ===== SAVE ===== */
window.save = async function(){
  let itemsArr=[];
  document.querySelectorAll("#items .row").forEach(r=>{
    itemsArr.push({name:r.querySelector(".n").value,qty:Number(r.querySelector(".q").value||0),price:Number(r.querySelector(".p").value||0)});
  });
  let totalVal=itemsArr.reduce((a,b)=>a+b.qty*b.price,0);
  let obj={user:currentUser,customer:customer.value,date:date.value,items:itemsArr,total:totalVal,memo:memo.value,paid:false};
  showLoading("保存中…");
  try {
    if(editIndex===-1){ await pushRecord(obj); }
    else { let k=recordsCache[editIndex]._key; obj.paid=recordsCache[editIndex].paid; await updateRecord(k,obj); }
  } finally { hideLoading(); }
  resetAddForm(); show("list");
};

/* ===== FILTER ===== */
window.setFilter = function(f){
  currentFilter=f;
  ["all","unpaid","paid"].forEach(k=>document.getElementById("f-"+k).classList.toggle("active",k===f));
  load();
};

/* ===== STAFF FILTER ===== */
function buildStaffFilter(){
  if(!currentUser||!users[currentUser]?.admin) return;
  let bar=document.getElementById("staffFilterBar"), wrap=document.getElementById("staffFilterWrap");
  if(!bar||!wrap) return;
  wrap.classList.remove("hidden");
  let html=`<button id="sf-all" onclick="setStaff('all')" class="${currentStaff==='all'?'active':''}">全員</button>`;

    html+=`<button id="sf-${u}" onclick="setStaff('${u}')" class="${currentStaff===u?'active':''}">${users[u].name}</button>`;
  });
  bar.innerHTML=html;
}

/* ===== SORT ===== */
window.setSort = function(s){
  if(s==="abc") abcDir=(currentSort==="abc")?abcDir*-1:1;
  currentSort=s;
  ["new","old","abc"].forEach(k=>document.getElementById("s-"+k).classList.toggle("active",k===s));
  let btn=document.getElementById("s-abc");
  btn.textContent = s==="abc" ? (abcDir===1?"あいうえお順 ▲":"ん〜あ順 ▼") : "あいうえお順";
  load();
};

/* ===== LOAD LIST ===== */
function load(){
  if(!currentUser) return;
  let d=getData();
  let visible=d.map((r,i)=>({r,i})).filter(({r})=>r.user===currentUser||users[currentUser].admin);
  if(currentFilter==="unpaid") visible=visible.filter(({r})=>!r.paid);
  if(currentFilter==="paid")   visible=visible.filter(({r})=>r.paid);
  if(users[currentUser].admin&&currentStaff!=="all") visible=visible.filter(({r})=>r.user===currentStaff);
  // フリーワード検索（取引先・商品名）
  let searchWord=(document.getElementById("searchBox")?.value||"").trim();
  if(searchWord){
    visible=visible.filter(({r})=>{
      let hit=(r.customer||"").includes(searchWord);
      if(!hit&&r.items) hit=r.items.some(it=>(it.name||"").includes(searchWord));
      return hit;
    });
  }
  visible.sort((a,b)=>{
    if(currentSort==="new") return (b.r.date||"").localeCompare(a.r.date||"");
    if(currentSort==="old") return (a.r.date||"").localeCompare(b.r.date||"");
    if(currentSort==="abc") return (a.r.customer||"").localeCompare(b.r.customer||"","ja")*abcDir;
  });
  records.innerHTML="";
  if(visible.length===0){ records.innerHTML='<div style="color:#999;padding:10px">該当する記録がありません</div>'; return; }
  visible.forEach(({r,i})=>{
    let userLabel=users[currentUser].admin?`<span style="font-size:12px;color:#888">${users[r.user]?.name||r.user}</span><br>`:"";
    // 商品名先頭4文字
    let firstName = (r.items && r.items[0] && r.items[0].name) ? r.items[0].name.slice(0,4) : "";
    // メモ先頭6文字
    let memoShort = (r.memo && r.memo.trim()) ? r.memo.trim().slice(0,6) : "";
    let memoSpan  = memoShort ? `<span style="font-size:12px;color:#888;margin-left:6px">📝${memoShort}</span>` : "";
    records.innerHTML+=`
      <div class="list">
        ${userLabel}${r.date} / ${r.customer}<br>
        <span style="font-size:12px;color:#555;margin-right:6px">${firstName}</span>¥${r.total}${memoSpan}<br>
        <span class="badge ${r.paid?'green':'red'}">${r.paid?'集金済':'未集金'}</span><br>
        <button class="small" onclick="toggle(${i})">切替</button>
        <button class="small" onclick="edit(${i})">編集</button>
        <button class="small" onclick="del(${i})">削除</button>
      </div>`;
  });
}

/* ===== DRAG SORT ===== */
let dragSrc=null;
function initDragSort(){
  let ul=document.getElementById("userList");
  let items=ul.querySelectorAll(".drag-item");

  items.forEach(item=>{
    let handle=item.querySelector(".drag-handle");

    // --- PC: mouseドラッグはhandleのみ ---
    handle.addEventListener("mousedown",()=>{ item.draggable=true; });
    item.addEventListener("dragend",()=>{ item.draggable=false; });

    item.addEventListener("dragstart",e=>{
      dragSrc=item;
      setTimeout(()=>item.style.opacity="0.4",0);
    });
    item.addEventListener("dragend",e=>{
      item.style.opacity="1";
      item.draggable=false;
      saveNewOrder();
    });
    item.addEventListener("dragover",e=>{
      e.preventDefault();
      if(!dragSrc||dragSrc===item) return;
      let b=item.getBoundingClientRect();
      if(e.clientY<b.top+b.height/2){ ul.insertBefore(dragSrc,item); }
      else { ul.insertBefore(dragSrc,item.nextSibling); }
    });

    // --- Mobile: touchはhandleのみ ---
    let clone=null;
    handle.addEventListener("touchstart",e=>{
      e.stopPropagation();
      dragSrc=item;
      item.style.opacity="0.4";
      clone=item.cloneNode(true);
      clone.style.cssText="position:fixed;left:10px;right:10px;background:#e3f2fd;border-radius:10px;padding:10px;z-index:999;pointer-events:none;opacity:0.85;box-shadow:0 4px 12px rgba(0,0,0,.2)";
      clone.style.top=(e.touches[0].clientY-30)+"px";
      document.body.appendChild(clone);
    },{passive:true});
    handle.addEventListener("touchmove",e=>{
      if(!clone) return;
      e.preventDefault();
      let y=e.touches[0].clientY;
      clone.style.top=(y-30)+"px";
      let els=[...ul.querySelectorAll(".drag-item")].filter(el=>el!==dragSrc);
      for(let i=0;i<els.length;i++){
        let b=els[i].getBoundingClientRect();
        if(y<b.top+b.height/2){ ul.insertBefore(dragSrc,els[i]); break; }
        else if(i===els.length-1){ ul.appendChild(dragSrc); }
      }
    },{passive:false});
    handle.addEventListener("touchend",e=>{
      item.style.opacity="1";
      if(clone){ clone.remove(); clone=null; }
      dragSrc=null;
      saveNewOrder();
    });
  });
}

async function saveNewOrder(){
  let items=document.getElementById("userList").querySelectorAll(".drag-item");
  userOrder=[...items].map(el=>el.dataset.id);
  // 売上残も即更新

    let remain=d.filter(x=>x.user===u&&!x.paid).reduce((a,b)=>a+b.total,0);
    html+=`${users[u].name}：¥${remain}<br>`;
  });

  buildStaffFilter();
  await saveUserOrder();
}

/* ===== BACKUP / RESTORE ===== */
window.exportBackup = function(){
  let backup={version:2,exportedAt:new Date().toISOString(),records:recordsCache,users:users};
  let blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  let url=URL.createObjectURL(blob);
  let now=new Date();
  let name="集金管理_backup_"+now.getFullYear()+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0")+".json";
  let a=document.createElement("a"); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url);
  let ts=now.toLocaleDateString("ja-JP")+" "+now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  localStorage.setItem("lastBackup",ts);
  document.getElementById("lastBackupTime").textContent=ts;
  document.getElementById("backupMsg").textContent="✅ バックアップを保存しました";
  setTimeout(()=>{ document.getElementById("backupMsg").textContent=""; },3000);
};
window.importBackup = async function(event){
  let file=event.target.files[0]; if(!file) return;
  let reader=new FileReader();
  reader.onload=async function(e){
    try {
      let backup=JSON.parse(e.target.result);
      if(!backup.records||!backup.users){ alert("形式が正しくありません"); return; }
      if(!confirm("バックアップから復元します。\n\n・売上記録："+backup.records.length+"件\n・社員数："+Object.keys(backup.users).length+"名\n\n現在のデータは上書きされます。よろしいですか？"))
        { document.getElementById("importFile").value=""; return; }
      showLoading("復元中…");
      try {
        let recObj={};
        backup.records.forEach((r,i)=>{ let {_key,...data}=r; recObj[_key||("i"+i+"_"+Date.now())]=data; });
        await set(ref(db,"records"),recObj);
        users=backup.users; await saveUsers();
      } finally { hideLoading(); }
      document.getElementById("backupMsg").style.color="#1976d2";
      document.getElementById("backupMsg").textContent="✅ "+backup.records.length+"件のデータを復元しました";
      setTimeout(()=>{ document.getElementById("backupMsg").textContent=""; document.getElementById("backupMsg").style.color="#43a047"; },4000);
    } catch(err){ alert("読み込みに失敗しました"); }
    document.getElementById("importFile").value="";
  };
  reader.readAsText(file);
};
function updateBackupTime(){
  let el=document.getElementById("lastBackupTime");
  if(el) el.textContent=localStorage.getItem("lastBackup")||"未保存";
}

/* ===== PULL TO RELOAD ===== */
(function(){
  let startY=0, pulling=false;
  const indicator=document.getElementById("pullIndicator");
  document.addEventListener("touchstart",e=>{
    if(window.scrollY===0){ startY=e.touches[0].clientY; pulling=true; }
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!pulling) return;
    let dist=e.touches[0].clientY-startY;
    if(dist>0&&dist<120){
      indicator.style.display="block";
      indicator.style.opacity=Math.min(dist/60,1);
      indicator.textContent=dist>60?"↑ 離してリロード":"↓ 引っ張ってリロード";
    }
  },{passive:true});
  document.addEventListener("touchend",e=>{
    if(!pulling) return;
    let dist=e.changedTouches[0].clientY-startY;
    if(dist>60){
      indicator.textContent="🔄 リロード中…";
      setTimeout(()=>location.reload(),300);
    } else {
      indicator.style.display="none";
    }
    pulling=false;
  });
})();

/* ===== SCAN IMAGE (AI読み取り) ===== */
window.scanImage = async function(event){
  let file = event.target.files[0];
  if(!file) return;

  let status = document.getElementById("scanStatus");
  status.textContent = "🔄 AIが読み取り中…";
  status.style.color = "#1976d2";

  try {
    // base64変換
    let base64 = await new Promise((res,rej)=>{
      let reader = new FileReader();
      reader.onload = ()=> res(reader.result.split(",")[1]);
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });

    let mediaType = file.type || "image/jpeg";

    // Anthropic API呼び出し
    let response;
    let data;
    try {
      response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              {
                type: "image",
                source: { type: "base64", media_type: mediaType, data: base64 }
              },
              {
                type: "text",
                text: "この請求書・納品書の画像から以下の情報をJSONのみで返してください。説明文不要。{"customer":"取引先名(様の前まで)","items":[{"name":"商品名","qty":数量の数値,"price":単価の数値}]} ルール:品名欄で数量と単価両方に数字がある行のみ含める。数値はカンマなし整数。"
              }
            ]
          }]
        })
      });
    } catch(fetchErr) {
      throw new Error("通信エラー: " + fetchErr.message + " (URL到達不可またはCORS)");
    }

    try {
      data = await response.json();
    } catch(jsonErr) {
      throw new Error("レスポンス解析失敗: HTTP " + response.status);
    }

    if(!response.ok){
      throw new Error("APIエラー " + response.status + ": " + (data.error?.message || JSON.stringify(data).slice(0,100)));
    }

    let text = data.content.map(c=>c.text||"").join("");

    // JSON部分だけ抽出
    let jsonMatch = text.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error("JSONが見つかりませんでした");
    let parsed = JSON.parse(jsonMatch[0]);

    // フォームに反映
    if(parsed.customer) customer.value = parsed.customer;

    if(parsed.items && parsed.items.length > 0){
      items.innerHTML = "";
      parsed.items.forEach(it=>{
        let div = document.createElement("div");
        div.className = "row";
        div.innerHTML = `
          <input class="n" value="${it.name||''}">
          <input class="q" value="${it.qty||''}" type="number" oninput="calc()">
          <input class="p" value="${it.price||''}" type="number" oninput="calc()">
        `;
        items.appendChild(div);
      });
      calc();
    }

    status.style.color = "#43a047";
    status.textContent = "✅ 読み取り完了！内容を確認してください";

  } catch(e) {
    status.style.color = "#e53935";
    status.textContent = "❌ 読み取り失敗：" + e.message;
    console.error("scan error:", e);
    // レスポンス詳細も表示
    if(typeof data !== "undefined"){
      console.error("API response:", JSON.stringify(data));
      status.textContent += " / " + JSON.stringify(data).slice(0,120);
    }
  }

  // inputをリセット（同じファイルを再選択できるように）
  event.target.value = "";
};
