<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="集金管理">
<title>集金管理くん</title>

<style>
body{margin:0;font-family:sans-serif;background:#f3f8ff}
header{background:#1976d2;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.container{padding:15px;max-width:800px;margin:auto}
.card{background:#fff;padding:15px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,button,textarea{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box;font-size:16px}
textarea{resize:vertical;min-height:60px}
button{background:#1976d2;color:#fff;border:none;font-weight:bold}
.small{width:auto;padding:6px 10px;margin-right:5px;font-size:12px}
.row{display:flex;gap:6px}
.row input{flex:1}
.hidden{display:none!important}
.list{padding:10px;border-bottom:1px solid #ddd}
.badge{padding:3px 8px;border-radius:8px;color:#fff;font-size:12px}
.red{background:#e53935}
.green{background:#43a047}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>

<header>集金管理くん</header>

<div class="container">

<div id="loginPage" class="card">
<h3>ログイン</h3>
<input id="loginId" placeholder="ID">
<input id="loginPw" type="password" placeholder="パスワード">
<button onclick="login()">ログイン</button>
</div>

<div id="mainPage" class="hidden">

<div class="card">
<div id="welcome"></div>
<button id="adminBtn" class="hidden" onclick="show('admin')">管理者</button>
<button onclick="show('home')">ホーム</button>
<button onclick="show('add')">納品登録</button>
<button onclick="show('list')">一覧</button>
<button onclick="logout()">ログアウト</button>
</div>

<div id="homePage" class="card hidden">
<h3>ホーム</h3>
<div id="summary"></div>
</div>

<div id="addPage" class="card hidden">
<h3>納品登録</h3>

<button onclick="document.getElementById('scanInput').click()" style="background:#43a047">📷 写真から読み取る</button>

<div id="scanStatus" style="font-size:13px;color:#1976d2;margin-bottom:8px;"></div>

<input type="file"
id="scanInput"
accept="image/*"
capture="environment"
class="hidden"
onchange="scanImage(event)">

<input id="customer" placeholder="取引先名">
<input id="date" type="date">

<div id="items"></div>

<button onclick="addItem()">＋商品追加</button>

<div>合計：¥<span id="total">0</span></div>

<textarea id="memo" placeholder="メモ"></textarea>

<button onclick="save()">保存</button>
</div>

<div id="listPage" class="card hidden">
<h3>一覧</h3>
<div id="records"></div>
</div>

<div id="adminPage" class="card hidden">
<h3>管理者ページ</h3>
<div id="adminSummary"></div>
<hr>
<div id="userList"></div>
</div>

</div>
</div>

<script>
let users = {
arai:{pass:"1234",name:"新井",admin:false},
hosoya:{pass:"1234",name:"細谷",admin:false},
ikeda:{pass:"1234",name:"池田",admin:false},
yamamoto:{pass:"1234",name:"山本",admin:true}
};

let currentUser=null;
let editId=null;

function getData(){
return JSON.parse(localStorage.getItem("records")||"[]");
}

function setData(d){
localStorage.setItem("records",JSON.stringify(d));
}

function login(){
let id=loginId.value.trim();
let pw=loginPw.value;

if(users[id] && users[id].pass===pw){
currentUser=id;
localStorage.setItem("loginUser",id);
start();
}else{
alert("ログイン失敗");
}
}

function logout(){
localStorage.removeItem("loginUser");
location.reload();
}

function start(){
loginPage.classList.add("hidden");
mainPage.classList.remove("hidden");

welcome.innerHTML=users[currentUser].name+" さん";

adminBtn.classList.toggle("hidden",!users[currentUser].admin);

resetForm();
load();

if(users[currentUser].admin){
show("admin");
adminView();
}else{
show("home");
summaryView();
}
}

function show(p){
homePage.classList.add("hidden");
addPage.classList.add("hidden");
listPage.classList.add("hidden");
adminPage.classList.add("hidden");

document.getElementById(p+"Page").classList.remove("hidden");

if(p==="list") load();
if(p==="home") summaryView();
if(p==="admin") adminView();
}

function resetForm(){
customer.value="";
memo.value="";
date.valueAsDate=new Date();
items.innerHTML="";
total.innerText="0";
editId=null;
addItem();
}

function addItem(){
let div=document.createElement("div");
div.className="row";
div.innerHTML=`
<input class="n" placeholder="商品名">
<input class="q" type="number" placeholder="数量" oninput="calc()">
<input class="p" type="number" placeholder="単価" oninput="calc()">
`;
items.appendChild(div);
}

function calc(){
let qs=document.querySelectorAll(".q");
let ps=document.querySelectorAll(".p");
let sum=0;

for(let i=0;i<qs.length;i++){
sum += (Number(qs[i].value)||0)*(Number(ps[i].value)||0);
}
total.innerText=sum;
}

function save(){
let arr=[];

document.querySelectorAll("#items .row").forEach(r=>{
arr.push({
name:r.querySelector(".n").value,
qty:Number(r.querySelector(".q").value||0),
price:Number(r.querySelector(".p").value||0)
});
});

let totalVal=arr.reduce((a,b)=>a+b.qty*b.price,0);

let d=getData();

let obj={
id: editId || Date.now(),
user: currentUser,
customer: customer.value,
date: date.value,
items: arr,
total: totalVal,
memo: memo.value,
paid:false
};

if(editId){
let idx=d.findIndex(x=>x.id==editId);
obj.paid=d[idx].paid;
d[idx]=obj;
}else{
d.push(obj);
}

setData(d);

resetForm();
load();
summaryView();
adminView();
show("list");
}

function load(){
let d=getData();

records.innerHTML="";

d.forEach(r=>{
if(r.user===currentUser || users[currentUser].admin){

records.innerHTML += `
<div class="list">
${users[currentUser].admin ? users[r.user].name+"<br>" : ""}
${r.date} / ${r.customer}<br>
¥${r.total}<br>
<span class="badge ${r.paid?'green':'red'}">${r.paid?'集金済':'未集金'}</span><br>

<button class="small" onclick="toggle(${r.id})">切替</button>
<button class="small" onclick="edit(${r.id})">編集</button>
<button class="small" onclick="del(${r.id})">削除</button>
</div>
`;
}
});
}

function toggle(id){
let d=getData();
let t=d.find(x=>x.id==id);
t.paid=!t.paid;
setData(d);
load();
summaryView();
adminView();
}

function del(id){
if(!confirm("削除しますか？")) return;

let d=getData().filter(x=>x.id!=id);
setData(d);
load();
summaryView();
adminView();
}

function edit(id){
let d=getData();
let r=d.find(x=>x.id==id);

customer.value=r.customer;
date.value=r.date;
memo.value=r.memo||"";

items.innerHTML="";

r.items.forEach(it=>{
let div=document.createElement("div");
div.className="row";
div.innerHTML=`
<input class="n" value="${it.name}">
<input class="q" type="number" value="${it.qty}" oninput="calc()">
<input class="p" type="number" value="${it.price}" oninput="calc()">
`;
items.appendChild(div);
});

editId=id;
calc();
show("add");
}

function summaryView(){
let d=getData().filter(x=>x.user===currentUser);

let remain=d.filter(x=>!x.paid).reduce((a,b)=>a+b.total,0);

summary.innerHTML=`
件数：${d.length}<br>
未集金：${d.filter(x=>!x.paid).length}<br>
売上残合計：¥${remain}
`;
}

function adminView(){
if(!users[currentUser].admin) return;

let d=getData();

adminSummary.innerHTML="<h4>社員別売上残</h4>";

Object.keys(users).forEach(u=>{
if(users[u].admin) return;

let remain=d.filter(x=>x.user===u && !x.paid)
.reduce((a,b)=>a+b.total,0);

adminSummary.innerHTML += `${users[u].name}：¥${remain}<br>`;
});

userList.innerHTML="";

Object.keys(users).forEach(u=>{
userList.innerHTML += `
<div class="list">
ID:${u}<br>
名前:${users[u].name}
</div>
`;
});
}

if(localStorage.getItem("loginUser")){
let saved=localStorage.getItem("loginUser");
if(users[saved]){
currentUser=saved;
start();
}
}
window.scanImage = async function(event){

const file = event.target.files[0];
if(!file) return;

// ===== APIキー =====
const API_KEY = "ここにあなたのAPIキー";
// ==================

const status = document.getElementById("scanStatus");
status.style.color = "#1976d2";
status.textContent = "🔄 商品欄を読み取り中...";

try{

// --------------------
// base64変換
// --------------------
const base64 = await new Promise((resolve,reject)=>{
  const reader = new FileReader();
  reader.onload = ()=>resolve(reader.result.split(",")[1]);
  reader.onerror = reject;
  reader.readAsDataURL(file);
});

// --------------------
// Vision API
// --------------------
const res = await fetch(
"https://vision.googleapis.com/v1/images:annotate?key="+API_KEY,
{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
requests:[
{
image:{content:base64},
features:[{type:"DOCUMENT_TEXT_DETECTION"}],
imageContext:{languageHints:["ja","en"]}
}
]
})
});

const json = await res.json();

const data = json.responses?.[0];
if(!data) throw new Error("OCR失敗");

const words = data.textAnnotations;
if(!words || words.length<=1) throw new Error("文字なし");

// ----------------------------------
// 全体サイズ取得
// ----------------------------------
let maxX = 0;
let maxY = 0;

words.forEach(w=>{
if(!w.boundingPoly || !w.boundingPoly.vertices) return;
w.boundingPoly.vertices.forEach(v=>{
if(v.x>maxX) maxX=v.x;
if(v.y>maxY) maxY=v.y;
});
});

// ----------------------------------
// 商品欄エリア（中央表部分のみ）
// 左8%〜右78%
// 上28%〜下74%
// ----------------------------------
const area = {
left:  maxX * 0.08,
right: maxX * 0.78,
top:   maxY * 0.28,
bottom:maxY * 0.74
};

// ----------------------------------
// 商品欄の文字だけ抽出
// ----------------------------------
let productWords = [];

for(let i=1;i<words.length;i++){

const w = words[i];
const v = w.boundingPoly.vertices;

const x = (v[0].x + v[1].x + v[2].x + v[3].x)/4;
const y = (v[0].y + v[1].y + v[2].y + v[3].y)/4;

if(
x >= area.left &&
x <= area.right &&
y >= area.top &&
y <= area.bottom
){
productWords.push({
text:w.description,
x:x,
y:y
});
}
}

// ----------------------------------
// 行ごとにまとめる
// ----------------------------------
productWords.sort((a,b)=>a.y-b.y);

let rows = [];

productWords.forEach(w=>{

let row = rows.find(r=>Math.abs(r.y - w.y) < 18);

if(!row){
row = { y:w.y, items:[] };
rows.push(row);
}

row.items.push(w);

});

// ----------------------------------
// 商品抽出
// 左=商品名 中=数量 右=単価
// ----------------------------------
let resultItems = [];

rows.forEach(r=>{

r.items.sort((a,b)=>a.x-b.x);

let nameParts = [];
let nums = [];

r.items.forEach(t=>{

if(/^[\d,]+$/.test(t.text)){
nums.push(t.text);
}else{
nameParts.push(t.text);
}

});

if(nums.length < 2) return;

let qty = Number(nums[0].replace(/,/g,""));
let price = Number(nums[1].replace(/,/g,""));

if(qty<=0 || price<=0) return;

let name = nameParts.join("");

name = name
.replace(/品名/g,"")
.replace(/数量/g,"")
.replace(/単価/g,"")
.replace(/金額/g,"")
.trim();

if(name.length < 2) return;

resultItems.push({
name:name,
qty:qty,
price:price
});

});

// 最大6件
resultItems = resultItems.slice(0,6);

// ----------------------------------
// 取引先名（様行だけ全文OCRから取得）
// ----------------------------------
let customerName = "";

const fullText = data.fullTextAnnotation?.text || "";
const lines = fullText.split("\n");

for(let i=0;i<lines.length;i++){

if(lines[i].includes("様")){

customerName = lines[i]
.replace("様","")
.replace(/御中/g,"")
.trim();

if(i>=1 && lines[i-1].length>5){
customerName =
lines[i-1].trim() + " " + customerName;
}

break;
}
}

if(customerName){
document.getElementById("customer").value = customerName;
}

// ----------------------------------
// フォーム反映
// ----------------------------------
items.innerHTML="";

if(resultItems.length===0){
addItem();
}else{

resultItems.forEach(it=>{

let div=document.createElement("div");
div.className="row";

div.innerHTML=`
<input class="n" value="${it.name}">
<input class="q" value="${it.qty}" type="number" oninput="calc()">
<input class="p" value="${it.price}" type="number" oninput="calc()">
`;

items.appendChild(div);

});

}

calc();

status.style.color="#43a047";
status.textContent="✅ 商品欄のみ読み取り完了";

}catch(e){

console.error(e);

status.style.color="#e53935";
status.textContent="❌ 読み取り失敗：" + e.message;

}

event.target.value="";

};
</script>

</body>
</html>
